<style>
/* Layout: 카드 한 장 = 앞 카드와의 연결 문장 → 영어 원문 → 한국어 번역 → 용어 → 푸피 1인칭 설명 → 해석(노란 칸) → 다음 카드로 이어지는 문장 */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --ink: #16201B;
  --muted: #5A675F;
  --line: #D2D9D3;
  --quote-bg: #E4EAE6;
  --accent: #D61F69;
  --accent-ink: #FFFFFF;
  --ok: #2F5D46;
  --ok-bg: #E1EDE5;
  --warn: #8A3B12;
  --warn-bg: #F6E3D6;
  --interp: #8A5A00;
  --interp-bg: #F6EBCF;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --font-quote: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --surface: #17201B; --ink: #E6ECE7; --muted: #98A69D; --line: #2A3830;
    --quote-bg: #1F2B25; --accent: #FF5C9A; --accent-ink: #1A0A12; --ok: #7FD6A0; --ok-bg: #1D3226;
    --warn: #F0B48F; --warn-bg: #3A2517;
    --interp: #E8BC52; --interp-bg: #33290F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #17201B; --ink: #E6ECE7; --muted: #98A69D; --line: #2A3830;
  --quote-bg: #1F2B25; --accent: #FF5C9A; --accent-ink: #1A0A12; --ok: #7FD6A0; --ok-bg: #1D3226;
  --warn: #F0B48F; --warn-bg: #3A2517;
  --interp: #E8BC52; --interp-bg: #33290F; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; }
a:focus-visible, button:focus-visible, textarea:focus-visible, .deck:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
.head h1 { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.4; }
.head .sub { font-size: 12.5px; color: var(--muted); font-family: var(--font-data); }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.mode button { appearance: none; border: 0; background: none; color: var(--muted); padding: 5px 13px; cursor: pointer; font-size: 13px; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.segs { display: flex; gap: 4px; }
.seg { flex: 1; height: 22px; padding: 0; appearance: none; border: 0; background: none; cursor: pointer; display: flex; align-items: center; }
.seg i { display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--line); transition: background .2s; }
.seg.on i { background: var(--accent); }
.seg.cur i { height: 6px; }

.deck { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.deck::-webkit-scrollbar { display: none; }
.card { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.meta .no { font-family: var(--font-data); font-size: 12.5px; color: var(--accent); font-weight: 500; }
.meta .ttl { font-size: 12px; letter-spacing: .1em; font-weight: 600; color: var(--muted); }
.meta .stage { margin-left: auto; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; }

.bridge { margin: 0; font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; max-width: 60ch; }

.orig { background: var(--quote-bg); border-radius: 8px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.orig .lab { font-family: var(--font-data); font-size: 11px; letter-spacing: .14em; color: var(--muted); margin: 0; }
.orig .q { font-family: var(--font-quote); font-style: italic; font-weight: 500; font-size: clamp(20px, 5.2vw, 26px); line-height: 1.38; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.orig .by { font-size: 12.5px; color: var(--muted); margin: 0; }
.orig .ko { margin: 0; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 600; font-size: 16px; line-height: 1.6; text-wrap: balance; }
.orig .ko small { display: block; font-weight: 500; font-size: 11px; letter-spacing: .12em; color: var(--muted); margin-bottom: 2px; font-family: var(--font-data); }
.terms { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.terms li { display: flex; flex-wrap: wrap; gap: 2px 8px; }
.terms b { font-family: var(--font-quote); font-style: italic; font-weight: 500; font-size: 15px; }

.expl { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.expl p { margin: 0; max-width: 60ch; }
.lab2 { font-weight: 600; letter-spacing: .12em; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.lab2 small { font-weight: 400; letter-spacing: 0; font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.tag { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; padding: 1px 8px; border-radius: 3px; background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }

.interp { background: var(--interp-bg); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.interp .lab2 { color: var(--interp); }
.interp p { margin: 0; max-width: 60ch; }
.wrap[data-interp="off"] .interp { display: none; }

.nextlead { margin: 0; font-size: 13.5px; color: var(--muted); text-align: right; max-width: 60ch; align-self: flex-end; }
.nextlead b { color: var(--accent); font-weight: 600; }

.cover-q { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 6.2vw, 32px); line-height: 1.4; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.flow { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0; counter-reset: f; }
.flow li { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.flow li:first-child { border-top: 0; }
.flow .n { font-family: var(--font-data); font-size: 12.5px; color: var(--accent); padding-top: 2px; }
.flow .t { font-weight: 600; }
.flow .d { color: var(--muted); font-size: 13px; grid-column: 2; }

.card.cover { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 26px 22px 20px; gap: 18px; justify-content: space-between; position: relative; overflow: hidden; }
.card.cover::before { content: ""; position: absolute; right: -60px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: var(--accent); opacity: .9; }
.card.cover > * { position: relative; }
.cv-kick { margin: 0; font-family: var(--font-data); font-size: 11.5px; letter-spacing: .18em; opacity: .75; }
.cv-title { margin: 28px 0 0; font-family: var(--font-quote); font-style: italic; font-weight: 500; font-size: clamp(32px, 9vw, 44px); line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; max-width: 15ch; }
.cv-ko { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.5; }
.cv-who { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; font-size: 13.5px; }
.cv-who b { font-weight: 600; letter-spacing: .02em; }
.cv-who span { opacity: .7; font-family: var(--font-data); font-size: 12px; }
.cv-q { margin: 4px 0 0; padding: 12px 0; border-top: 1px solid currentColor; border-bottom: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 30%, transparent); font-family: var(--font-display); font-weight: 600; font-size: 15.5px; line-height: 1.6; text-wrap: balance; }
.card.cover .flow li { border-top-color: color-mix(in srgb, currentColor 22%, transparent); }
.card.cover .flow .n { color: var(--accent); }
.card.cover .flow .d { color: inherit; opacity: .7; }
.cv-hint { margin: 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; }
.cv-hint a { color: inherit; }
.cv-hint span { opacity: .75; }

.wrap[data-mode="ko"] .orig .q,
.wrap[data-mode="ko"] .orig .lab { display: none; }
.wrap[data-mode="ko"] .orig .ko { border-top: 0; padding-top: 0; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nav button.step { appearance: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
.nav button.step:disabled { opacity: .35; cursor: default; }
.nav .count { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
textarea { width: 100%; min-height: 110px; resize: vertical; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.saved { font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
.rules { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.rules p { margin: 0; }

@media (prefers-reduced-motion: reduce) { .seg i { transition: none; } }
@media (max-width: 420px) { .card { padding: 14px; } }
</style>

  <div class="head">

</main>

  deck.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
  });
  paint(0);

  var mBoth = document.getElementById("m-both"), mKo = document.getElementById("m-ko");
  function setMode(m) {
    wrap.setAttribute("data-mode", m);
    mBoth.setAttribute("aria-pressed", m === "both" ? "true" : "false");
    mKo.setAttribute("aria-pressed", m === "ko" ? "true" : "false");
  }
  mBoth.addEventListener("click", function () { setMode("both"); });
  mKo.addEventListener("click", function () { setMode("ko"); });

  var iOn = document.getElementById("i-on"), iOff = document.getElementById("i-off");
  function setInterp(v) {
    wrap.setAttribute("data-interp", v);
    iOn.setAttribute("aria-pressed", v === "on" ? "true" : "false");
    iOff.setAttribute("aria-pressed", v === "off" ? "true" : "false");
  }
  iOn.addEventListener("click", function () { setInterp("on"); });
  iOff.addEventListener("click", function () { setInterp("off"); });

  var KEY = "trailcard-puppi-v1";
  var memo = document.getElementById("memo");
  var saved = document.getElementById("saved");
  var stanceBtns = Array.prototype.slice.call(document.querySelectorAll("[data-stance]"));
  var state = { memo: "", stance: "" };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); state.memo = o.memo || ""; state.stance = o.stance || ""; }
  } catch (e) {}
  memo.value = state.memo;
  function paintStance() {
    stanceBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-stance") === state.stance ? "true" : "false"); });
  }
  paintStance();
  var timer = null;
  function persist() {
    var ok = true;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { ok = false; }
    saved.textContent = ok ? "이 브라우저에 저장했습니다." : "이 화면에서는 저장되지 않습니다. 창을 닫으면 사라집니다.";
  }
  memo.addEventListener("input", function () {
    state.memo = memo.value; saved.textContent = "";
    clearTimeout(timer); timer = setTimeout(persist, 500);
  });
  stanceBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-stance");
      state.stance = state.stance === v ? "" : v;
      paintStance(); persist();
    });
  });
})();
</script>
